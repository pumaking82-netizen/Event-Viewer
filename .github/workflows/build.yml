name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PC Crash Monitor
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm PC_Crash_Monitor.spec

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\PC_Crash_Monitor.exe")) {
            throw "dist\PC_Crash_Monitor.exe was not created"
          }

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "dist\PC_Crash_Monitor.exe" "artifact\PC_Crash_Monitor.exe"
          Copy-Item "README.md" "artifact\README.md"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PC-Crash-Monitor-Windows
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
